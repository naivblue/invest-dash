<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Dash</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📉</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0e1117; --card:#171b23; --line:#252b36;
  --tx:#e6e9ef; --dim:#8b93a3;
  --up:#f0616d; --down:#4b9fea; --warn:#e0a33a; --ok:#3fb98c;
}
*{box-sizing:border-box}
body{margin:0;padding:28px 20px 60px;background:var(--bg);color:var(--tx);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
h1 span{color:var(--dim);font-weight:500}
.meta{font-size:12px;color:var(--dim)}

.stage{border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px;
  background:linear-gradient(135deg,var(--card),#12161d)}
.stage .badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;
  border:1px solid currentColor;margin-bottom:11px}
.stage h2{margin:0 0 6px;font-size:24px;letter-spacing:-.02em}
.stage p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
.s1{color:var(--ok)} .s2{color:var(--warn)} .s3{color:#e8802f} .s4{color:var(--up)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 17px}
.card .k{font-size:12px;color:var(--dim);letter-spacing:.02em;margin-bottom:9px}
.card .v{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.card .chg{font-size:13px;font-weight:600;margin-top:5px}
.card .sub{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
.card .sub b{color:var(--tx);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}

table{width:100%;border-collapse:collapse;background:var(--card);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
caption{text-align:left;font-size:12px;color:var(--dim);padding:0 2px 8px}
th,td{padding:11px 15px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--dim);font-weight:600;background:#12161d}
tr:last-child td{border-bottom:none}
td.hit{color:var(--warn);font-weight:600}
footer{margin-top:26px;font-size:11.5px;color:var(--dim);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Market Dash <span>· QQQ / QLD 매수 신호</span></h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>
  <div id="app"></div>
  <footer>
    데이터: Yahoo Finance (yfinance) · 평일 미국장 마감 후 자동 갱신 · 종가 기준(실시간 아님)<br>
    단계 판정은 QQQ 52주 고점대비 하락률이 결정하고, −10%대 구간에서만 RSI&lt;35가 AND 게이트로 붙는다. 투자 권유 아님.
  </footer>
</div>
<script>
const f = (n, d = 2) => n.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const sign = n => (n > 0 ? '+' : '') + n.toFixed(2) + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'down' : '';

const vixMood = v => v >= 30 ? ['공포', 'up'] : v >= 20 ? ['경계', ''] : ['평온', 'down'];

function card({k, v, chg, sub}) {
  const rows = (sub || []).map(([a, b]) => `<div class="sub"><span>${a}</span><b>${b}</b></div>`).join('');
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div>
    <div class="chg ${cls(chg)}">${sign(chg)}</div>${rows}</div>`;
}

fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
  const [mood, moodCls] = vixMood(d.vix.price);
  document.getElementById('meta').textContent =
    `기준일 ${d.asof} · 갱신 ${d.updated.slice(0, 16).replace('T', ' ')} UTC`;

  document.getElementById('app').innerHTML = `
    <div class="stage">
      <div class="badge s${d.stage.n}">STAGE ${d.stage.n}</div>
      <h2>${d.stage.label}</h2>
      <p>${d.stage.action}</p>
    </div>

    <div class="grid">
      ${card({k: 'QQQ', v: '$' + f(d.qqq.price), chg: d.qqq.chg_pct, sub: [
        ['52주 고점대비', `<span class="${cls(d.qqq.drawdown_pct)}">${d.qqq.drawdown_pct.toFixed(1)}%</span>`],
        ['RSI(14)', d.qqq.rsi]]})}
      ${card({k: 'QLD (2x)', v: '$' + f(d.qld.price), chg: d.qld.chg_pct, sub: [
        ['52주 고점대비', `<span class="${cls(d.qld.drawdown_pct)}">${d.qld.drawdown_pct.toFixed(1)}%</span>`],
        ['RSI(14)', d.qld.rsi]]})}
      ${card({k: 'VIX 공포지수', v: f(d.vix.price, 1), chg: d.vix.chg_pct, sub: [
        ['상태', `<span class="${moodCls}">${mood}</span>`],
        ['기준', '20 경계 / 30 공포']]})}
      ${card({k: 'USD/KRW 환율', v: '₩' + f(d.fx.price, 1), chg: d.fx.chg_pct, sub: [
        ['환헤지 감각', d.fx.price >= 1400 ? '고환율 — 분할 환전' : '중립']]})}
    </div>

    <table>
      <caption>QLD 매수 트리거 — QQQ 52주 고점 $${f(d.qqq.high52)} 기준, 매 갱신마다 재계산</caption>
      <tr><th>QQQ</th><th>고점대비</th><th>행동</th></tr>
      ${[[-10, 'RSI&lt;35 동반 시 실탄 1/3 → QQQ (QLD 대기)'],
         [-20, '<b>QLD 진입 시작</b> (여력 절반)'],
         [-30, '<b>QLD 한도까지</b> + 잔여 실탄 전액']]
        .map(([p, act]) => `<tr>
          <td class="${d.qqq.price <= d.triggers[p] ? 'hit' : ''}">$${f(d.triggers[p])} 이하</td>
          <td>${p}%</td><td>${act}</td></tr>`).join('')}
    </table>`;
}).catch(e => {
  document.getElementById('meta').textContent = '데이터 로드 실패';
  document.getElementById('app').innerHTML = `<div class="card">data.json을 못 읽었다: ${e}</div>`;
});
</script>
</body>
</html>
