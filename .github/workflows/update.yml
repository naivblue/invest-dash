name: update data

on:
  schedule:
    # 매일 2회. 한국장·미국장 마감 시각이 달라서 한 번만 돌면 한쪽이 하루 묵는다.
    - cron: "0 7 * * *"     # UTC 07:00 = KST 16:00 — 한국장 마감 후 (코스피·삼성전자·환율)
    - cron: "10 22 * * *"   # UTC 22:10 = KST 익일 07:10 — 미국장 마감 후 (QQQ·QLD·S&P·나스닥·VIX)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python update.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "변동 없음" && exit 0
          git commit -m "data: ${{ github.run_id }}"
          git push
