name: update data

on:
  schedule:
    - cron: "10 22 * * 1-5"   # UTC 22:10 = 미국장 마감 후 (KST 익일 07:10)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python update.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "변동 없음" && exit 0
          git commit -m "data: ${{ github.run_id }}"
          git push
